[project]
name = "vision-tutorial"
version = "0.1.0"
description = "Vision 알고리즘 따라하기 — OpenCV부터 YOLO·SAM·VLM까지 예제 코드"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# 하한은 실측 버전 (2026-10-03, Ubuntu 22.04/24.04 · Python 3.12). 나머지 그룹은 각 장 실측 후 고정한다
dependencies = [
    "numpy>=2.5",
    "opencv-python>=5.0",
    "matplotlib>=3.11",
    "pillow>=12.0",
    "jupyter",
]

[project.optional-dependencies]
# ultralytics 8.4.171로 실측 (04~05장). lap는 05장 Tracking에서 쓴다
dl = [
    "torch",
    "torchvision",
    "timm",
    "ultralytics>=8.4",
    "lap",
]
# 06장부터: timm(ViT·Swin), transformers(DETR·DINOv2·Florence-2·SAM), scipy(헝가리안 매칭), pycocotools(COCO mAP), kernels(SAM 3 후처리)
foundation = [
    "torch",
    "torchvision",
    "timm",
    "scipy",
    "pycocotools",
    "transformers",
    "accelerate",
    "kernels",
    "open-clip-torch",
    "faiss-cpu",
]
# 16장 프로젝트(번호판 인식·Hybrid Pipeline)의 OCR 구성 요소
ocr = [
    "rapidocr",
]
# Qwen3.5 — vLLM 서버는 Linux GPU 환경에 별도 설치 (pip install vllm)
vlm = [
    "torch",
    "transformers",
    "accelerate",
    "openai",
]
deploy = [
    "onnx",
    "onnxslim",
    "onnxruntime",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
